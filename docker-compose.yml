services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  mongo-rs-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo-init.js:/scripts/mongo-init.js:ro
    entrypoint: ["mongosh", "mongodb://mongo:27017/admin", "--quiet", "/scripts/mongo-init.js"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env.docker
    environment:
      MONGODB_URI: mongodb://mongo:27017/pizzahop?replicaSet=rs0
      NODE_ENV: development
      PORT: "3000"
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./server/src:/app/server/src
    command: ["node", "--watch", "server/src/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client

volumes:
  mongo_data:
